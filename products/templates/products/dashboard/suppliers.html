            <div id="suppliers" class="tab-content">
                <div class="section-header">
                    <h1>Supplier Management</h1>
                    <button class="btn btn-green" onclick="openModal('supplierModal')"><i class="fa-solid fa-plus"></i> Add Supplier</button>
                </div>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Supplier Name</th><th>Phone</th><th>Email Address</th><th style="text-align: center;">Action</th></tr>
                    </thead>
                    <tbody>
                        {% for supplier in suppliers %}
                        <tr>
                            <td>#{{ supplier.id }}</td>
                            <td><b>{{ supplier.name }}</b></td>
                            <td>{{ supplier.phone|default:"-" }}</td>
                            <td>{{ supplier.email|default:"-" }}</td>
                            <td style="text-align: center;">
                                <div style="display: inline-flex; gap: 8px; justify-content: center;">
                                    <button type="button" class="btn btn-green" style="min-width: 90px; padding: 6px 12px; font-size: 12px; justify-content: center;" onclick="openEditSupplierModal('{{ supplier.id }}', '{{ supplier.name }}', '{{ supplier.phone|default:'' }}', '{{ supplier.email|default:'' }}')"><i class="fa-solid fa-pen"></i> ပြင်မည်</button>
                                    <form action="{% url 'products:delete_supplier' supplier.id %}" method="POST" style="display:inline;">
                                        {% csrf_token %}
                                        <button type="submit" class="btn btn-danger" style="min-width: 90px; padding: 6px 12px; font-size: 12px; justify-content: center;" onclick="return confirm('ဖျက်မှာ သေချာလား?')"><i class="fa-solid fa-trash"></i> ဖျက်မည်</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="5" style="text-align: center; color: #999; padding: 20px;">ပစ္စည်း ပေးသွင်းသူ မရှိပါ။</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
